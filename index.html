<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>出馬表</title>
<style>
:root { --bg: #f6f7f9; --fg: #1d2330; --muted: #5b6474; --line: #d9dde4; --accent: #2f6fde; --card: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg: #12151b; --fg: #e8ebf1; --muted: #9aa3b2; --line: #2c323d; --accent: #6ea0ff; --card: #1a1e26; } }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
#bar { position: fixed; top: 0; left: 0; right: 0; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px;
       background: var(--card); border-bottom: 1px solid var(--line); font-size: 13px; z-index: 2; }
#bar select, #bar button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
#bar #newer { background: var(--accent); color: #fff; border-color: var(--accent); }
#status { color: var(--muted); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#frame { position: fixed; top: 40px; left: 0; width: 100%; height: calc(100% - 40px); border: 0; background: var(--bg); }
#lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 3; padding: 16px; box-sizing: border-box; }
#lock form { width: 100%; max-width: 360px; display: grid; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-sizing: border-box; }
#lock input[type=password] { font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
#lock button { font-size: 16px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; }
#msg { color: var(--muted); font-size: 13px; min-height: 1em; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="bar">
  <select id="date" aria-label="日付"></select>
  <span id="status">読み込み中…</span>
  <button id="newer" type="button" hidden></button>
  <button id="forget" type="button" title="この端末に覚えた合言葉を消す">鍵を消す</button>
</div>
<iframe id="frame" title="出馬表"></iframe>
<div id="lock" hidden>
  <form id="form">
    <div style="font-weight:600">合言葉</div>
    <input name="username" value="keiba" autocomplete="username" hidden>
    <input id="pass" type="password" autocomplete="current-password" required>
    <label style="font-size:13px"><input id="remember" type="checkbox" checked> この端末で覚える</label>
    <button type="submit">開く</button>
    <div id="msg"></div>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
